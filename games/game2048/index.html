<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>2048 קלאסי — 2048 Classic Original</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #faf8ef; color: #776e65; font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .header { width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .title { font-size: 80px; font-weight: bold; color: #776e65; }
        .scores { display: flex; gap: 15px; }
        .score-box { background: #bbada0; padding: 10px 25px; border-radius: 8px; color: #fff; text-align: center; }
        .score-title { font-size: 16px; font-weight: bold; color: #eee4da; }
        .score-val { font-size: 32px; font-weight: bold; }
        #board { width: 650px; height: 650px; background: #bbada0; border-radius: 12px; padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 15px; position: relative; }
        .tile { width: 142px; height: 142px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: bold; transition: all 0.12s ease; }
        .tile-empty { background: rgba(238, 228, 218, 0.35); }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 44px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 44px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 44px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 36px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 36px; box-shadow: 0 0 30px rgba(243, 215, 116, 0.6); }
        .hint { margin-top: 25px; font-size: 22px; color: #8f7a66; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">2048</div>
        <div class="scores">
            <div class="score-box">
                <div class="score-title">ניקוד</div>
                <div id="score" class="score-val">0</div>
            </div>
            <div class="score-box">
                <div class="score-title">שיא</div>
                <div id="best-score" class="score-val">0</div>
            </div>
        </div>
    </div>
    <div id="board"></div>
    <div class="hint">🎮 שלט LG: חיצי תנועה להחלקת המשבצות • מקש אישור (OK) לאתחול משחק • חזרה ליציאה</div>

<script>
let grid = Array.from({length: 4}, () => Array(4).fill(0));
let score = 0, best = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSlide(freq = 400) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function init() {
    grid = Array.from({length: 4}, () => Array(4).fill(0));
    score = 0;
    document.getElementById('score').innerText = '0';
    spawnTile(); spawnTile();
    render();
}

function spawnTile() {
    const empty = [];
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) empty.push({r, c});
        }
    }
    if (empty.length > 0) {
        const spot = empty[Math.floor(Math.random() * empty.length)];
        grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }
}

function render() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            const val = grid[r][c];
            const tile = document.createElement('div');
            tile.className = `tile ${val > 0 ? 'tile-' + val : 'tile-empty'}`;
            tile.innerText = val > 0 ? val : '';
            board.appendChild(tile);
        }
    }
}

function slideRow(row) {
    let arr = row.filter(v => v !== 0);
    for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            score += arr[i];
            arr.splice(i + 1, 1);
        }
    }
    while (arr.length < 4) arr.push(0);
    return arr;
}

function move(dir) {
    let moved = false;
    const oldGrid = JSON.stringify(grid);

    if (dir === 'left') {
        for (let r = 0; r < 4; r++) grid[r] = slideRow(grid[r]);
    } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) grid[r] = slideRow(grid[r].reverse()).reverse();
    } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
            let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
            col = slideRow(col);
            for (let r = 0; r < 4; r++) grid[r][c] = col[r];
        }
    } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
            let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
            col = slideRow(col);
            for (let r = 0; r < 4; r++) grid[3 - r][c] = col[r];
        }
    }

    if (JSON.stringify(grid) !== oldGrid) {
        playSlide(450);
        spawnTile();
        document.getElementById('score').innerText = score;
        if (score > best) { best = score; document.getElementById('best-score').innerText = best; }
        render();
    }
}

window.addEventListener('keydown', (e) => {
    switch (e.keyCode) {
        case 37: move('left'); break;
        case 38: move('up'); break;
        case 39: move('right'); break;
        case 40: move('down'); break;
        case 13: init(); break;
        case 461: case 27:
            if (window.parent && window.parent.closeGame) window.parent.closeGame();
            else history.back();
            break;
    }
});

init();
</script>
</body>
</html>
