<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>שבירת לבנים 1976 — Atari Breakout Classic</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #canvas-box { position: relative; width: 1200px; height: 900px; border: 4px solid #444; }
        canvas { width: 1200px; height: 900px; background: #000; }
        .hud { width: 1200px; display: flex; justify-content: space-between; font-size: 32px; font-weight: bold; margin-bottom: 12px; }
        .hint { font-size: 22px; color: #888; margin-top: 15px; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div class="hud">
        <span>BREAKOUT 1976 ATARI</span>
        <span>ניקוד: <span id="score-val">0</span></span>
        <span>פסילות: <span id="lives-val">3</span></span>
    </div>
    <div id="canvas-box">
        <canvas id="breakout" width="1200" height="900"></canvas>
    </div>
    <div class="hint">🎮 שלט LG: ימינה/שמאלה או סמן Magic Remote • מקש אישור (OK) לשיגור כדור • חזרה ליציאה</div>

<script>
const canvas = document.getElementById('breakout');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-val');
const livesEl = document.getElementById('lives-val');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur = 0.06) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

const paddleW = 140, paddleH = 18;
let paddleX = 530;
let ballX = 600, ballY = 820;
let ballDX = 5, ballDY = -5;
let ballActive = false;
let score = 0, lives = 3;
let leftPressed = false, rightPressed = false;

const rows = 6, cols = 14;
const brickW = 78, brickH = 24, padding = 6, offsetTop = 80, offsetLeft = 14;
const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];
let bricks = [];

function initBricks() {
    bricks = [];
    for (let r = 0; r < rows; r++) {
        bricks[r] = [];
        for (let c = 0; c < cols; c++) {
            bricks[r][c] = { x: offsetLeft + c * (brickW + padding), y: offsetTop + r * (brickH + padding), status: 1, color: colors[r] };
        }
    }
}
initBricks();

function resetBall() {
    ballActive = false;
    ballX = paddleX + paddleW / 2;
    ballY = 840;
    ballDX = (Math.random() > 0.5 ? 1 : -1) * 5;
    ballDY = -5;
}

function update() {
    if (leftPressed && paddleX > 10) paddleX -= 12;
    if (rightPressed && paddleX < 1200 - paddleW - 10) paddleX += 12;

    if (!ballActive) {
        ballX = paddleX + paddleW / 2;
        ballY = 840;
        return;
    }

    ballX += ballDX;
    ballY += ballDY;

    // Walls
    if (ballX <= 10 || ballX >= 1190) { ballDX = -ballDX; beep(280); }
    if (ballY <= 10) { ballDY = -ballDY; beep(280); }

    // Paddle Hit
    if (ballY >= 850 && ballY <= 868 && ballX >= paddleX && ballX <= paddleX + paddleW) {
        const hit = (ballX - (paddleX + paddleW / 2)) / (paddleW / 2);
        ballDX = hit * 7;
        ballDY = -Math.abs(ballDY);
        beep(440);
    }

    // Bottom Fall
    if (ballY > 900) {
        lives--;
        livesEl.innerText = lives;
        beep(140, 0.3);
        if (lives <= 0) {
            lives = 3; score = 0;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            initBricks();
        }
        resetBall();
    }

    // Bricks collision
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const b = bricks[r][c];
            if (b.status === 1) {
                if (ballX > b.x && ballX < b.x + brickW && ballY > b.y && ballY < b.y + brickH) {
                    ballDY = -ballDY;
                    b.status = 0;
                    score += (6 - r) * 10;
                    scoreEl.innerText = score;
                    beep(520 + r * 50);
                }
            }
        }
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 1200, 900);

    // Bricks
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const b = bricks[r][c];
            if (b.status === 1) {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, brickW, brickH);
            }
        }
    }

    // Paddle
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(paddleX, 856, paddleW, paddleH);

    // Ball
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ballX, ballY, 9, 0, Math.PI * 2);
    ctx.fill();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scale = 1200 / rect.width;
    paddleX = Math.max(10, Math.min(1200 - paddleW - 10, (e.clientX - rect.left) * scale - paddleW / 2));
});

window.addEventListener('keydown', (e) => {
    switch (e.keyCode) {
        case 37: leftPressed = true; break;
        case 39: rightPressed = true; break;
        case 13: case 32: ballActive = true; break;
        case 461: case 27:
            if (window.parent && window.parent.closeGame) window.parent.closeGame();
            else history.back();
            break;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.keyCode === 37) leftPressed = false;
    if (e.keyCode === 39) rightPressed = false;
});
</script>
</body>
</html>
