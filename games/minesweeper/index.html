<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>שולה המוקשים 1990 — Windows 95 Minesweeper Original</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #008080; color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .window { background: #c0c0c0; border: 4px solid #fff; border-right-color: #808080; border-bottom-color: #808080; box-shadow: 0 10px 40px rgba(0,0,0,0.6); padding: 6px; width: 680px; }
        .title-bar { background: #000080; color: #fff; padding: 6px 12px; font-weight: bold; font-size: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .board-header { background: #c0c0c0; border: 4px solid #808080; border-right-color: #fff; border-bottom-color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .lcd-display { background: #000; color: #ff0000; font-family: 'Courier New', monospace; font-size: 38px; font-weight: 900; padding: 2px 10px; border: 2px solid #808080; }
        .face-btn { width: 50px; height: 50px; background: #c0c0c0; border: 3px solid #fff; border-right-color: #808080; border-bottom-color: #808080; font-size: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .face-btn:active { border: 3px solid #808080; border-right-color: #fff; border-bottom-color: #fff; }
        #grid { display: grid; grid-template-columns: repeat(16, 38px); grid-template-rows: repeat(16, 38px); gap: 2px; border: 4px solid #808080; border-right-color: #fff; border-bottom-color: #fff; padding: 6px; background: #808080; justify-content: center; }
        .cell { width: 38px; height: 38px; background: #c0c0c0; border: 3px solid #fff; border-right-color: #808080; border-bottom-color: #808080; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; cursor: pointer; }
        .cell.revealed { background: #bdbdbd; border: 1px solid #7b7b7b; }
        .cell.cursor { outline: 3px solid #2563eb; outline-offset: -3px; }
        .hint { margin-top: 20px; font-size: 22px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>Minesweeper — שולה המוקשים Windows 95</span>
            <span style="cursor:pointer;" onclick="exitGame()">✕</span>
        </div>
        <div class="board-header">
            <div id="mine-counter" class="lcd-display">040</div>
            <div id="face-btn" class="face-btn" onclick="initGame()">🙂</div>
            <div id="timer" class="lcd-display">000</div>
        </div>
        <div id="grid"></div>
    </div>
    <div class="hint">🎮 שלט LG: עכבר Magic Remote לקליק • D-Pad: חיצים לתנועה, אישור (OK) לחשיפה, מקש צהוב/אדום לדגלון • חזרה ליציאה</div>

<script>
const ROWS = 16, COLS = 16, MINES = 40;
let grid = [], revealed = [], flags = [];
let gameOver = false, gameStarted = false, timerVal = 0, timerInterval = null;
let cursorR = 0, cursorC = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur = 0.05) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function initGame() {
    clearInterval(timerInterval);
    timerVal = 0; document.getElementById('timer').innerText = '000';
    document.getElementById('mine-counter').innerText = '040';
    document.getElementById('face-btn').innerText = '🙂';
    gameOver = false; gameStarted = false;
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    flags = Array.from({length: ROWS}, () => Array(COLS).fill(false));

    // Place Mines
    let placed = 0;
    while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (grid[r][c] !== -1) {
            grid[r][c] = -1;
            placed++;
        }
    }

    // Numbers
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c] === -1) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === -1) count++;
                }
            }
            grid[r][c] = count;
        }
    }
    renderGrid();
}

const colorMap = ['', '#0000ff', '#008000', '#ff0000', '#000080', '#800000', '#008080', '#000000', '#808080'];

function renderGrid() {
    const el = document.getElementById('grid');
    el.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = `cell ${revealed[r][c] ? 'revealed' : ''} ${cursorR === r && cursorC === c ? 'cursor' : ''}`;
            if (revealed[r][c]) {
                if (grid[r][c] === -1) {
                    cell.innerText = '💣';
                    cell.style.background = '#f87171';
                } else if (grid[r][c] > 0) {
                    cell.innerText = grid[r][c];
                    cell.style.color = colorMap[grid[r][c]];
                }
            } else if (flags[r][c]) {
                cell.innerText = '🚩';
            }
            cell.addEventListener('click', () => reveal(r, c));
            cell.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(r, c); });
            el.appendChild(cell);
        }
    }
}

function startTimer() {
    if (!gameStarted) {
        gameStarted = true;
        timerInterval = setInterval(() => {
            timerVal++;
            document.getElementById('timer').innerText = String(timerVal).padStart(3, '0');
        }, 1000);
    }
}

function reveal(r, c) {
    if (gameOver || revealed[r][c] || flags[r][c]) return;
    startTimer();

    if (grid[r][c] === -1) {
        // BOOM
        gameOver = true;
        clearInterval(timerInterval);
        document.getElementById('face-btn').innerText = '😵';
        // reveal all mines
        for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) {
                if (grid[i][j] === -1) revealed[i][j] = true;
            }
        }
        beep(120, 0.4);
        renderGrid();
        return;
    }

    revealed[r][c] = true;
    beep(400);

    // Flood fill zeros
    if (grid[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !revealed[nr][nc]) {
                    reveal(nr, nc);
                }
            }
        }
    }

    // Check Win
    let unrevealedSafe = 0;
    for (let i = 0; i < ROWS; i++) {
        for (let j = 0; j < COLS; j++) {
            if (grid[i][j] !== -1 && !revealed[i][j]) unrevealedSafe++;
        }
    }
    if (unrevealedSafe === 0) {
        gameOver = true;
        clearInterval(timerInterval);
        document.getElementById('face-btn').innerText = '😎';
        beep(880, 0.4);
    }
    renderGrid();
}

function toggleFlag(r, c) {
    if (gameOver || revealed[r][c]) return;
    flags[r][c] = !flags[r][c];
    beep(600);
    renderGrid();
}

function exitGame() {
    if (window.parent && window.parent.closeGame) window.parent.closeGame();
    else history.back();
}

window.addEventListener('keydown', (e) => {
    switch (e.keyCode) {
        case 37: cursorC = Math.max(0, cursorC - 1); renderGrid(); break;
        case 39: cursorC = Math.min(COLS - 1, cursorC + 1); renderGrid(); break;
        case 38: cursorR = Math.max(0, cursorR - 1); renderGrid(); break;
        case 40: cursorR = Math.min(ROWS - 1, cursorR + 1); renderGrid(); break;
        case 13: reveal(cursorR, cursorC); break;
        case 403: case 404: case 405: case 406: toggleFlag(cursorR, cursorC); break; // Red/Yellow/Green/Blue
        case 461: case 27: exitGame(); break;
    }
});

initGame();
</script>
</body>
</html>
