<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>ארקייד נוסטלגיה וענן — 200+ משחקים אונליין ולטלוויזיה LG webOS</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #070913; color: #ffffff; }

        #hub-view {
            position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
            background: radial-gradient(circle at 85% 15%, #1e1b4b 0%, #070913 75%);
        }

        /* Header */
        header {
            width: 100%; height: 85px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, transparent 100%);
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 16px; }
        .logo-badge {
            background: linear-gradient(135deg, #06b6d4, #a855f7); color: #fff;
            padding: 6px 18px; border-radius: 12px; font-size: 20px; font-weight: 900; letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
        }
        .brand-title { font-size: 24px; font-weight: 800; color: #f8fafc; }
        
        .header-tools { display: flex; align-items: center; gap: 16px; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-input {
            width: 300px; height: 42px; background: rgba(30, 41, 59, 0.85); border: 2px solid #475569;
            border-radius: 20px; padding: 0 40px 0 16px; font-size: 16px; color: #ffffff; outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus { width: 360px; border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        .search-icon { position: absolute; right: 14px; font-size: 16px; color: #94a3b8; pointer-events: none; }

        .cloud-status {
            display: flex; align-items: center; gap: 8px; font-size: 16px; color: #4ade80; font-weight: bold;
            background: rgba(15, 23, 42, 0.8); padding: 6px 14px; border-radius: 20px; border: 1px solid #22c55e;
        }
        .cloud-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }

        /* Category Filter Pills */
        #filters-bar {
            display: flex; gap: 10px; padding: 0 40px; margin-top: 5px; z-index: 10; overflow-x: auto;
        }
        #filters-bar::-webkit-scrollbar { display: none; }
        .filter-pill {
            flex-shrink: 0; background: rgba(30, 41, 59, 0.65); border: 2px solid #475569; color: #94a3b8;
            padding: 6px 18px; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; outline: none;
        }
        .filter-pill:hover, .filter-pill.active, .filter-pill:focus {
            background: #38bdf8; color: #0f172a; border-color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* Hero Showcase */
        #hero-area {
            position: relative; height: 380px; padding: 10px 40px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .hero-info { max-width: 1000px; z-index: 5; }
        .badges-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .tag {
            background: rgba(30, 41, 59, 0.85); border: 1px solid #64748b; color: #38bdf8;
            font-size: 15px; font-weight: bold; padding: 3px 12px; border-radius: 8px;
        }
        .tag.gold { background: rgba(234, 179, 8, 0.15); border-color: #eab308; color: #facc15; }
        .tag.green { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #4ade80; }
        .hero-title {
            font-size: 44px; font-weight: 900; color: #ffffff; margin-bottom: 8px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }
        .hero-desc { font-size: 19px; color: #cbd5e1; line-height: 1.4; margin-bottom: 14px; min-height: 52px; }
        .hero-controls-hint { font-size: 17px; color: #c084fc; font-weight: bold; margin-bottom: 16px; }
        .btn-play {
            background: linear-gradient(135deg, #06b6d4, #a855f7); color: #ffffff;
            font-size: 24px; font-weight: 800; padding: 12px 40px; border-radius: 14px; border: none;
            cursor: pointer; box-shadow: 0 0 30px rgba(6, 182, 212, 0.7); transition: all 0.2s ease; outline: none;
        }
        .btn-play:focus, .btn-play:hover, .btn-play.active {
            transform: scale(1.08); box-shadow: 0 0 45px rgba(168, 85, 247, 1); border: 3px solid #ffffff;
        }
        .hero-poster {
            width: 440px; height: 260px; border-radius: 18px; border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.9); object-fit: cover;
        }

        /* Carousel Track */
        #carousel-container {
            width: 100%; height: 350px; padding: 0 40px 15px; position: relative;
        }
        .carousel-track {
            display: flex; gap: 18px; overflow-x: auto; padding: 12px 5px; scroll-behavior: smooth;
        }
        .carousel-track::-webkit-scrollbar { display: none; }

        .game-card {
            flex: 0 0 190px; height: 265px; background: #111827; border: 3px solid #1f2937;
            border-radius: 16px; padding: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1); outline: none;
        }
        .game-card:hover, .game-card:focus, .game-card.focused {
            transform: translateY(-8px) scale(1.06); border-color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        }
        .card-icon {
            width: 110px; height: 110px; border-radius: 14px; object-fit: cover;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .card-name { font-size: 15px; font-weight: 800; text-align: center; color: #f1f5f9; margin-top: 4px; line-height: 1.25; }
        .card-meta { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: #94a3b8; }
        .card-badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: bold; }

        /* Fullscreen Player */
        #player-view {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000;
            z-index: 1000; display: none;
        }
        #player-view.active { display: block; }
        #game-frame { width: 100%; height: 100%; border: none; display: block; }
        #exit-bar {
            position: absolute; top: 15px; left: 20px; background: rgba(15, 23, 42, 0.9);
            border: 2px solid #ef4444; color: #ffffff; font-size: 18px; font-weight: bold;
            padding: 8px 20px; border-radius: 12px; cursor: pointer; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            z-index: 1010; transition: all 0.2s ease;
        }
        #exit-bar:hover { background: #ef4444; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="hub-view">
    <header>
        <div class="brand">
            <span class="logo-badge">CLOUD ARCADE 200+</span>
            <span class="brand-title">ארקייד נוסטלגיה וענן — 206 משחקים לטלוויזיה LG webOS ולדפדפן</span>
        </div>
        <div class="header-tools">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="חיפוש משחק בעברית / אנגלית...">
            </div>
            <div class="cloud-status">
                <div class="cloud-dot"></div>
                <span id="catalog-count-label">206 משחקים פעילים</span>
            </div>
        </div>
    </header>

    <div id="filters-bar">
        <button class="filter-pill active" data-cat="ALL">🌟 הכל (206)</button>
        <button class="filter-pill" data-cat="POINTER">🎯 סמן Magic Remote (5)</button>
        <button class="filter-pill" data-cat="NES">🎮 נינטנדו NES (60)</button>
        <button class="filter-pill" data-cat="SEGA">🦔 סגה Genesis (45)</button>
        <button class="filter-pill" data-cat="DOS">💀 משחקי DOS (35)</button>
        <button class="filter-pill" data-cat="FLASH">⚡ פלאש ורשת (35)</button>
        <button class="filter-pill" data-cat="ARCADE">🕹️ ארקייד מטבעות (25)</button>
        <button class="filter-pill" data-cat="OFFLINE">💾 מותקן מקומית (16)</button>
    </div>

    <div id="hero-area">
        <div class="hero-info">
            <div class="badges-row">
                <span id="hero-badge-lang" class="tag gold">עברית מלאה</span>
                <span id="hero-badge-platform" class="tag">פלטפורמה</span>
                <span id="hero-badge-mode" class="tag green">⚡ טעינת ענן ישירה</span>
            </div>
            <h1 id="hero-title" class="hero-title">Angry Birds Rio</h1>
            <p id="hero-desc" class="hero-desc">גרסת ריו הברזילאית האגדית! שחרר את הציפורים הכלואות בכלובים עם שלט ה-Magic Remote של ה-LG שלך.</p>
            <div id="hero-controls" class="hero-controls-hint">🎮 שליטה: סמן השלט (פוינטר) למתיחת הרוגטקה ושחרור</div>
            <div class="hero-actions">
                <button id="btn-hero-play" class="btn-play active">▶ שַׂחֵק עַכְשָׁיו</button>
            </div>
        </div>
        <img id="hero-poster" class="hero-poster" src="apps/retrohub/games/angrybirds_rio/splash.png" alt="Game Banner">
    </div>

    <div id="carousel-container">
        <div class="carousel-track" id="cards-track"></div>
    </div>
</div>

<div id="player-view">
    <button id="exit-bar">✕ חֲזָרָה לְאַרְקֵייד הָעֲנָן (חזור בשלט)</button>
    <iframe id="game-frame" src="about:blank"></iframe>
</div>

<!-- Load Database -->
<script src="games_data.js"></script>

<script>
class UISound {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    beep(f, d=0.05) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.frequency.setValueAtTime(f, this.ctx.currentTime);
        g.gain.setValueAtTime(0.08, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + d);
    }
}
const uiSound = new UISound();

let currentFilter = 'ALL';
let filteredList = typeof GAMES_CATALOG !== 'undefined' ? GAMES_CATALOG : [];
let selectedIndex = 0;
let isInGame = false;
let searchQuery = '';

const track = document.getElementById('cards-track');

function fixUrl(url) {
    if (!url) return 'about:blank';
    if (url.startsWith('games/')) {
        return 'apps/retrohub/' + url;
    }
    return url;
}

function applyFilters() {
    let list = typeof GAMES_CATALOG !== 'undefined' ? GAMES_CATALOG : [];
    
    // Category filter
    if (currentFilter === 'OFFLINE') {
        list = list.filter(g => g.is_offline);
    } else if (currentFilter !== 'ALL') {
        list = list.filter(g => g.cat === currentFilter);
    }
    
    // Search query
    if (searchQuery.trim().length > 0) {
        const q = searchQuery.trim().toLowerCase();
        list = list.filter(g => 
            (g.title_he && g.title_he.toLowerCase().includes(q)) ||
            (g.title_en && g.title_en.toLowerCase().includes(q)) ||
            (g.desc && g.desc.toLowerCase().includes(q))
        );
    }
    
    filteredList = list;
    document.getElementById('catalog-count-label').innerText = `${filteredList.length} משחקים`;
    buildCards();
}

function buildCards() {
    track.innerHTML = '';
    selectedIndex = 0;

    if (filteredList.length === 0) {
        track.innerHTML = '<div style="font-size:24px; color:#94a3b8; padding:50px;">לא נמצאו משחקים תואמים לחיפוש זה.</div>';
        return;
    }

    filteredList.forEach((g, idx) => {
        const card = document.createElement('div');
        card.className = `game-card ${idx === 0 ? 'focused' : ''}`;
        const iconSrc = fixUrl(g.icon);
        card.innerHTML = `
            <img class="card-icon" src="${iconSrc}" alt="${g.title_he}" onerror="this.src='apps/retrohub/games/mario/icon.png'">
            <div class="card-name">${g.title_he}</div>
            <div class="card-meta">
                <span>${g.year || ''}</span>
                <span class="card-badge">${g.badge || g.platform}</span>
            </div>
        `;
        card.addEventListener('click', () => {
            selectGame(idx);
            launchGame();
        });
        track.appendChild(card);
    });

    if (filteredList.length > 0) updateHero(filteredList[0]);
}

function updateHero(g) {
    if (!g) return;
    document.getElementById('hero-title').innerText = g.title_he;
    document.getElementById('hero-desc').innerText = g.desc;
    document.getElementById('hero-badge-lang').innerText = g.is_offline ? 'עברית מלאה (מקומי)' : 'ענן מקוון (Online)';
    document.getElementById('hero-badge-platform').innerText = `${g.platform} • ${g.year}`;
    document.getElementById('hero-badge-mode').innerText = g.is_offline ? '⚡ מותקן בטלוויזיה' : '☁️ טעינת ענן ישירה';
    document.getElementById('hero-controls').innerText = `🎮 שליטה: ${g.controls}`;
    
    const posterImg = document.getElementById('hero-poster');
    posterImg.src = fixUrl(g.poster || g.icon || 'games/angrybirds_rio/splash.png');
    posterImg.onerror = () => { posterImg.src = 'apps/retrohub/games/mario/splash.png'; };
}

function selectGame(idx) {
    uiSound.beep(480);
    selectedIndex = (idx + filteredList.length) % filteredList.length;
    const cards = document.querySelectorAll('.game-card');
    cards.forEach((c, i) => {
        if (i === selectedIndex) {
            c.classList.add('focused');
            c.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
            c.classList.remove('focused');
        }
    });
    updateHero(filteredList[selectedIndex]);
}

function launchGame() {
    uiSound.beep(720, 0.1);
    const g = filteredList[selectedIndex];
    const frame = document.getElementById('game-frame');
    frame.src = fixUrl(g.url);
    document.getElementById('player-view').classList.add('active');
    isInGame = true;
    frame.focus();
}

function closeGame() {
    uiSound.beep(360);
    const frame = document.getElementById('game-frame');
    frame.src = 'about:blank';
    document.getElementById('player-view').classList.remove('active');
    isInGame = false;
    window.focus();
}

document.getElementById('btn-hero-play').addEventListener('click', launchGame);
document.getElementById('exit-bar').addEventListener('click', closeGame);

// Filter buttons
document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.cat;
        applyFilters();
    });
});

// Search input
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    applyFilters();
});

// Remote Control Handler
window.addEventListener('keydown', (e) => {
    uiSound.init();
    if (isInGame) {
        if (e.keyCode === 461 || e.keyCode === 27) { // LG Back key or ESC
            closeGame();
            e.preventDefault();
        }
        return;
    }
    
    if (document.activeElement === searchInput) {
        if (e.keyCode === 13) {
            searchInput.blur();
            if (filteredList.length > 0) selectGame(0);
        }
        return;
    }

    switch (e.keyCode) {
        case 37: selectGame(selectedIndex + 1); break; // Left Arrow
        case 39: selectGame(selectedIndex - 1); break; // Right Arrow
        case 13: launchGame(); break; // OK Button
        case 461:
        case 27:
            if (searchQuery.length > 0) {
                searchQuery = '';
                searchInput.value = '';
                applyFilters();
            }
            break;
    }
});

applyFilters();
</script>
</body>
</html>
