<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>פלאפי בירד רטרו - Flappy Bird LG webOS TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
        #game-container { position: relative; width: 1920px; height: 1080px; background: linear-gradient(180deg, #70c5ce 0%, #a0e3ea 70%, #ded895 70%, #567d46 72%, #74bf2e 100%); }
        canvas { display: block; width: 1920px; height: 1080px; }
        #hud {
            position: absolute; top: 25px; left: 50px; right: 50px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 30px; font-weight: 900; color: #fff; text-shadow: 2px 2px 8px #000;
            pointer-events: none;
        }
        .badge { background: rgba(0,0,0,0.6); padding: 8px 24px; border-radius: 14px; border: 2px solid #facc15; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="hud">
        <div class="badge">🐥 FLAPPY BIRD RETRO — לחץ בשלט לנופף בכנפיים!</div>
        <div class="badge">נִיקוּד: <span id="score-val">0</span> | שִׂיא: <span id="best-val">0</span></div>
    </div>
    <canvas id="flappyCanvas" width="1920" height="1080"></canvas>
</div>

<script>
class FlappyAudio {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    flap() {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.frequency.setValueAtTime(450, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.1);
    }
    score() {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(987, this.ctx.currentTime);
        o.frequency.setValueAtTime(1318, this.ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.25);
    }
    hit() {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.3);
    }
}
const sfx = new FlappyAudio();

const canvas = document.getElementById('flappyCanvas');
const ctx = canvas.getContext('2d');

let bird = { x: 350, y: 500, vy: 0, r: 26, rot: 0 };
let pipes = [];
let frame = 0;
let score = 0;
let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
let state = 'START'; // START, PLAY, DEAD
const GRAVITY = 0.48;
const FLAP_FORCE = -11;
const PIPE_GAP = 300;
const PIPE_SPEED = 5;

document.getElementById('best-val').innerText = bestScore;

function jump() {
    sfx.init();
    if (state === 'START') {
        state = 'PLAY';
        resetGame();
        sfx.flap();
        bird.vy = FLAP_FORCE;
    } else if (state === 'PLAY') {
        sfx.flap();
        bird.vy = FLAP_FORCE;
    } else if (state === 'DEAD') {
        state = 'PLAY';
        resetGame();
        sfx.flap();
        bird.vy = FLAP_FORCE;
    }
}

function resetGame() {
    bird.y = 500;
    bird.vy = 0;
    bird.rot = 0;
    pipes = [];
    score = 0;
    document.getElementById('score-val').innerText = score;
}

function spawnPipe() {
    const minY = 200;
    const maxY = 650;
    const topH = Math.floor(Math.random() * (maxY - minY)) + minY;
    pipes.push({
        x: 1920,
        topH: topH,
        bottomY: topH + PIPE_GAP,
        w: 110,
        passed: false
    });
}

function update() {
    frame++;

    if (state === 'PLAY') {
        bird.vy += GRAVITY;
        bird.y += bird.vy;
        bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 12)));

        if (frame % 110 === 0) {
            spawnPipe();
        }

        // Move pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            p.x -= PIPE_SPEED;

            // Score
            if (!p.passed && p.x + p.w < bird.x) {
                p.passed = true;
                score++;
                sfx.score();
                document.getElementById('score-val').innerText = score;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('flappy_best', bestScore);
                    document.getElementById('best-val').innerText = bestScore;
                }
            }

            // Collision check
            if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w) {
                if (bird.y - bird.r < p.topH || bird.y + bird.r > p.bottomY) {
                    gameOver();
                }
            }

            if (p.x + p.w < -50) {
                pipes.splice(i, 1);
            }
        }

        // Ground / Ceiling collision
        if (bird.y + bird.r >= 950 || bird.y - bird.r <= 0) {
            gameOver();
        }
    } else if (state === 'START') {
        bird.y = 500 + Math.sin(frame * 0.08) * 15;
    } else if (state === 'DEAD') {
        if (bird.y + bird.r < 950) {
            bird.vy += GRAVITY * 1.5;
            bird.y += bird.vy;
            bird.rot = Math.PI / 2;
        }
    }
}

function gameOver() {
    if (state === 'PLAY') {
        state = 'DEAD';
        sfx.hit();
    }
}

function draw() {
    ctx.clearRect(0, 0, 1920, 1080);

    // Pipes
    pipes.forEach(p => {
        // Top pipe
        const gradTop = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
        gradTop.addColorStop(0, '#53a027');
        gradTop.addColorStop(0.3, '#74bf2e');
        gradTop.addColorStop(0.8, '#53a027');
        gradTop.addColorStop(1, '#2c5913');

        ctx.fillStyle = gradTop;
        ctx.strokeStyle = '#183307';
        ctx.lineWidth = 5;

        ctx.fillRect(p.x, 0, p.w, p.topH);
        ctx.strokeRect(p.x, 0, p.w, p.topH);
        ctx.fillRect(p.x - 6, p.topH - 40, p.w + 12, 40);
        ctx.strokeRect(p.x - 6, p.topH - 40, p.w + 12, 40);

        // Bottom pipe
        ctx.fillRect(p.x, p.bottomY, p.w, 950 - p.bottomY);
        ctx.strokeRect(p.x, p.bottomY, p.w, 950 - p.bottomY);
        ctx.fillRect(p.x - 6, p.bottomY, p.w + 12, 40);
        ctx.strokeRect(p.x - 6, p.bottomY, p.w + 12, 40);
    });

    // Ground
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, 950, 1920, 130);
    ctx.fillStyle = '#74bf2e';
    ctx.fillRect(0, 950, 1920, 20);
    ctx.strokeStyle = '#567d46';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 950); ctx.lineTo(1920, 950);
    ctx.stroke();

    // Bird
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // Body
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Belly
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(-4, 6, bird.r * 0.65, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    const wingY = Math.sin(frame * 0.3) * 6;
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.ellipse(-8, wingY, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(10, -8, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(12, -8, 4, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(16, 2);
    ctx.lineTo(36, 8);
    ctx.lineTo(16, 14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    // Overlay text
    if (state === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, 1920, 1080);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 64px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 15;
        ctx.fillText('FLAPPY BIRD 4K RETRO', 960, 420);
        ctx.font = '700 36px "Segoe UI", sans-serif';
        ctx.fillStyle = '#fde047';
        ctx.fillText('לחץ בסמן השלט או כפתור אישור (OK) כדי להתחיל', 960, 520);
    } else if (state === 'DEAD') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, 1920, 1080);
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 70px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('נִפְסַלְתָּ!', 960, 420);
        ctx.font = '700 38px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`ניקוד: ${score}  |  שיא: ${bestScore}`, 960, 500);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('לחץ אישור או הקלק לשחק שוב', 960, 580);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Input Handlers
window.addEventListener('keydown', (e) => {
    if (e.keyCode === 13 || e.keyCode === 38 || e.keyCode === 32) {
        jump();
        e.preventDefault();
    }
});

canvas.addEventListener('click', () => {
    jump();
});

loop();
</script>
</body>
</html>
