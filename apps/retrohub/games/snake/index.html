<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>סנייק נוקיה 1997 — Snake 97 Nokia 3310</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #111; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; }
        .nokia-phone { width: 800px; height: 950px; background: #88a090; border: 18px solid #2d3748; border-radius: 40px; box-shadow: 0 0 60px rgba(0,0,0,0.9); padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .lcd-screen { width: 100%; height: 750px; background: #9bbc0f; border: 8px solid #0f380f; border-radius: 12px; position: relative; box-shadow: inset 0 0 25px rgba(15, 56, 15, 0.4); display: flex; flex-direction: column; align-items: center; }
        .lcd-header { width: 100%; height: 50px; border-bottom: 4px solid #0f380f; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 28px; font-weight: 900; color: #0f380f; }
        canvas { width: 680px; height: 650px; image-rendering: pixelated; margin-top: 20px; }
        .footer-hint { font-size: 22px; color: #cbd5e1; margin-top: 15px; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
<div style="display:flex; flex-direction:column; align-items:center;">
    <div class="nokia-phone">
        <div class="lcd-screen">
            <div class="lcd-header">
                <span>NOKIA 3310</span>
                <span>ניקוד: <span id="score-val">0</span></span>
            </div>
            <canvas id="snake-canvas" width="400" height="380"></canvas>
        </div>
        <div style="font-size:24px; font-weight:bold; color:#1a202c;">SNAKE II • 1997 NOKIA</div>
    </div>
    <div class="footer-hint">🎮 שלט LG: 4 חיצי הכיוון • מקש אישור (OK) להתחלת משחק • חזרה לתפריט</div>
</div>

<script>
const canvas = document.getElementById('snake-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-val');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur = 0.05) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

const GRID = 20;
const COLS = 20, ROWS = 19;
let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
let dir = {x: 1, y: 0};
let nextDir = {x: 1, y: 0};
let food = {x: 15, y: 10};
let score = 0;
let gameOver = false;
let speed = 120;

function placeFood() {
    food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
    };
    if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
}

function update() {
    if (gameOver) return;
    dir = nextDir;
    const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        beep(140, 0.4);
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        beep(750, 0.08);
        placeFood();
        if (speed > 60) speed -= 2;
    } else {
        snake.pop();
    }
}

function draw() {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(0, 0, 400, 380);

    // Border
    ctx.strokeStyle = '#0f380f';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, 396, 376);

    // Food
    ctx.fillStyle = '#0f380f';
    ctx.fillRect(food.x * GRID + 3, food.y * GRID + 3, GRID - 6, GRID - 6);

    // Snake
    snake.forEach((s, i) => {
        ctx.fillStyle = '#0f380f';
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
        // Eye on head
        if (i === 0) {
            ctx.fillStyle = '#9bbc0f';
            ctx.fillRect(s.x * GRID + 5, s.y * GRID + 5, 4, 4);
        }
    });

    if (gameOver) {
        ctx.fillStyle = 'rgba(15, 56, 15, 0.85)';
        ctx.fillRect(40, 140, 320, 100);
        ctx.fillStyle = '#9bbc0f';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('משחק נגמר!', 200, 180);
        ctx.font = '16px monospace';
        ctx.fillText('לחץ אישור (OK) למשחק חדש', 200, 215);
    }
}

function tick() {
    update();
    draw();
    setTimeout(tick, speed);
}
tick();

window.addEventListener('keydown', (e) => {
    switch (e.keyCode) {
        case 38: if (dir.y === 0) nextDir = {x: 0, y: -1}; break;
        case 40: if (dir.y === 0) nextDir = {x: 0, y: 1}; break;
        case 37: if (dir.x === 0) nextDir = {x: -1, y: 0}; break;
        case 39: if (dir.x === 0) nextDir = {x: 1, y: 0}; break;
        case 13:
            if (gameOver) {
                snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
                dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
                score = 0; scoreEl.innerText = 0;
                speed = 120; gameOver = false;
                placeFood();
            }
            break;
        case 461:
        case 27:
            if (window.parent && window.parent.closeGame) window.parent.closeGame();
            else history.back();
            break;
    }
});
</script>
</body>
</html>
