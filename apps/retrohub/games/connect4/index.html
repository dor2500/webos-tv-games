<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>4 בשורה 1974 — Connect 4 Milton Bradley Original</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hud { width: 850px; display: flex; justify-content: space-between; align-items: center; font-size: 32px; font-weight: bold; margin-bottom: 25px; }
        #board-wrapper { position: relative; width: 850px; height: 720px; background: #1d4ed8; border-radius: 24px; padding: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.9); border: 6px solid #3b82f6; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 15px; width: 100%; height: 100%; }
        .slot { width: 95px; height: 95px; background: #0f172a; border-radius: 50%; box-shadow: inset 0 6px 12px rgba(0,0,0,0.9); cursor: pointer; transition: transform 0.15s ease; }
        .slot.red { background: radial-gradient(circle at 35% 35%, #f87171, #dc2626); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .slot.yellow { background: radial-gradient(circle at 35% 35%, #fde047, #ca8a04); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .slot.win { outline: 6px solid #fff; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        #arrow-selector { position: absolute; top: -50px; left: 45px; font-size: 40px; color: #ef4444; transition: left 0.15s ease; pointer-events: none; }
        .hint { margin-top: 25px; font-size: 22px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="hud">
        <span>CONNECT 4 • 4 בשורה</span>
        <span id="turn-indicator" style="color:#ef4444;">תור: שחקן אדום</span>
        <span>ניצחונות: <span id="p1-score" style="color:#ef4444;">0</span> - <span id="p2-score" style="color:#eab308;">0</span></span>
    </div>
    <div id="board-wrapper">
        <div id="arrow-selector">▼</div>
        <div id="grid" class="grid"></div>
    </div>
    <div class="hint">🎮 שלט LG: ימינה/שמאלה או סמן Magic Remote • מקש אישור (OK) להפלת דיסקית • חזרה ליציאה</div>

<script>
const ROWS = 6, COLS = 7;
let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
let curPlayer = 1; // 1 = Red, 2 = Yellow (AI)
let colSelected = 3;
let gameOver = false;
let p1Wins = 0, p2Wins = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function dropSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}

function initBoard() {
    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    curPlayer = 1;
    gameOver = false;
    document.getElementById('turn-indicator').innerText = 'תור: שחקן אדום (אתה)';
    document.getElementById('turn-indicator').style.color = '#ef4444';
    render();
    updateArrow();
}

function render() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const slot = document.createElement('div');
            slot.className = `slot ${board[r][c] === 1 ? 'red' : board[r][c] === 2 ? 'yellow' : ''}`;
            slot.onclick = () => dropDisc(c);
            gridEl.appendChild(slot);
        }
    }
}

function updateArrow() {
    const arrow = document.getElementById('arrow-selector');
    arrow.style.left = `${45 + colSelected * 114}px`;
    arrow.style.color = curPlayer === 1 ? '#ef4444' : '#eab308';
}

function dropDisc(c) {
    if (gameOver) return;
    for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] === 0) {
            board[r][c] = curPlayer;
            dropSound();
            render();
            if (checkWin(r, c, curPlayer)) {
                gameOver = true;
                if (curPlayer === 1) { p1Wins++; document.getElementById('p1-score').innerText = p1Wins; }
                else { p2Wins++; document.getElementById('p2-score').innerText = p2Wins; }
                document.getElementById('turn-indicator').innerText = curPlayer === 1 ? '🎉 ניצחון לאדום!' : '🤖 ניצחון למחשב!';
                return;
            }
            curPlayer = curPlayer === 1 ? 2 : 1;
            document.getElementById('turn-indicator').innerText = curPlayer === 1 ? 'תור: שחקן אדום (אתה)' : 'תור: מחשב חכם (צהוב)...';
            document.getElementById('turn-indicator').style.color = curPlayer === 1 ? '#ef4444' : '#eab308';
            updateArrow();

            if (curPlayer === 2 && !gameOver) {
                setTimeout(aiMove, 500);
            }
            return;
        }
    }
}

function aiMove() {
    if (gameOver) return;
    // 1. Try win
    for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r][c] === 0) {
                board[r][c] = 2;
                if (checkWin(r, c, 2)) { board[r][c] = 0; dropDisc(c); return; }
                board[r][c] = 0; break;
            }
        }
    }
    // 2. Block player 1
    for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r][c] === 0) {
                board[r][c] = 1;
                if (checkWin(r, c, 1)) { board[r][c] = 0; dropDisc(c); return; }
                board[r][c] = 0; break;
            }
        }
    }
    // Center column bias
    const validCols = [];
    [3, 2, 4, 1, 5, 0, 6].forEach(c => {
        if (board[0][c] === 0) validCols.push(c);
    });
    if (validCols.length > 0) dropDisc(validCols[0]);
}

function checkWin(r, c, p) {
    const directions = [
        [[0, 1], [0, -1]], // Horizontal
        [[1, 0], [-1, 0]], // Vertical
        [[1, 1], [-1, -1]], // Diagonal /
        [[1, -1], [-1, 1]]  // Diagonal \
    ];
    for (let d of directions) {
        let count = 1;
        for (let [dr, dc] of d) {
            let nr = r + dr, nc = c + dc;
            while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === p) {
                count++;
                nr += dr; nc += dc;
            }
        }
        if (count >= 4) return true;
    }
    return false;
}

window.addEventListener('keydown', (e) => {
    switch (e.keyCode) {
        case 37: colSelected = (colSelected - 1 + COLS) % COLS; updateArrow(); break;
        case 39: colSelected = (colSelected + 1) % COLS; updateArrow(); break;
        case 13:
            if (gameOver) initBoard();
            else if (curPlayer === 1) dropDisc(colSelected);
            break;
        case 461: case 27:
            if (window.parent && window.parent.closeGame) window.parent.closeGame();
            else history.back();
            break;
    }
});

initBoard();
</script>
</body>
</html>
