<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>פונג קלאסי 1972 — Atari PONG Original</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #fff; font-family: 'Courier New', monospace; }
        #canvas-wrapper { position: relative; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; }
        canvas { width: 1920px; height: 1080px; background: #000; image-rendering: pixelated; }
        .hud { position: absolute; top: 30px; left: 0; width: 100%; display: flex; justify-content: center; gap: 300px; font-size: 80px; font-weight: 900; letter-spacing: 10px; }
        .controls-hint { position: absolute; bottom: 20px; font-size: 22px; color: #888; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
<div id="canvas-wrapper">
    <div class="hud">
        <span id="score-p1">0</span>
        <span id="score-p2">0</span>
    </div>
    <canvas id="pong" width="960" height="540"></canvas>
    <div class="controls-hint">🎮 שלט LG: חיצי למעלה/למטה או סמן Magic Remote • מקש אישור (OK) להגשה • חזרה ליציאה</div>
</div>

<script>
const canvas = document.getElementById('pong');
const ctx = canvas.getContext('2d');
const scoreP1El = document.getElementById('score-p1');
const scoreP2El = document.getElementById('score-p2');

// Web Audio sound synth
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, dur = 0.08) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

const paddleH = 80, paddleW = 16;
let p1Y = 230, p2Y = 230;
let ballX = 480, ballY = 270;
let ballSpeedX = 6, ballSpeedY = 3;
let scoreP1 = 0, scoreP2 = 0;
let upPressed = false, downPressed = false;

function resetBall() {
    ballX = 480; ballY = 270;
    ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * 6;
    ballSpeedY = (Math.random() * 4 - 2) * 2;
}

function update() {
    // Player 1 controls
    if (upPressed && p1Y > 10) p1Y -= 9;
    if (downPressed && p1Y < 540 - paddleH - 10) p1Y += 9;

    // AI Player 2
    const targetY = ballY - paddleH / 2;
    if (p2Y < targetY - 10) p2Y += 5.5;
    else if (p2Y > targetY + 10) p2Y -= 5.5;
    p2Y = Math.max(10, Math.min(540 - paddleH - 10, p2Y));

    // Ball movement
    ballX += ballSpeedX;
    ballY += ballSpeedY;

    // Top / Bottom bounce
    if (ballY <= 10 || ballY >= 530) {
        ballSpeedY = -ballSpeedY;
        playBeep(320);
    }

    // Left Paddle bounce
    if (ballX <= 40 + paddleW && ballX >= 30 && ballY >= p1Y && ballY <= p1Y + paddleH) {
        ballSpeedX = Math.abs(ballSpeedX) * 1.05 + 0.2;
        const delta = (ballY - (p1Y + paddleH / 2)) / (paddleH / 2);
        ballSpeedY = delta * 7;
        playBeep(480);
    }

    // Right Paddle bounce
    if (ballX >= 920 - paddleW && ballX <= 930 && ballY >= p2Y && ballY <= p2Y + paddleH) {
        ballSpeedX = -Math.abs(ballSpeedX) * 1.05 - 0.2;
        const delta = (ballY - (p2Y + paddleH / 2)) / (paddleH / 2);
        ballSpeedY = delta * 7;
        playBeep(480);
    }

    // Score Check
    if (ballX < 0) {
        scoreP2++;
        scoreP2El.innerText = scoreP2;
        playBeep(180, 0.3);
        resetBall();
    } else if (ballX > 960) {
        scoreP1++;
        scoreP1El.innerText = scoreP1;
        playBeep(640, 0.3);
        resetBall();
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 960, 540);

    // Center dotted line
    ctx.fillStyle = '#444';
    for (let i = 10; i < 540; i += 30) {
        ctx.fillRect(476, i, 8, 15);
    }

    // Paddles
    ctx.fillStyle = '#fff';
    ctx.fillRect(30, p1Y, paddleW, paddleH);
    ctx.fillRect(960 - 30 - paddleW, p2Y, paddleW, paddleH);

    // Ball
    ctx.fillRect(ballX - 8, ballY - 8, 16, 16);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Magic Remote Pointer Tracking
window.addEventListener('mousemove', (e) => {
    const scale = 540 / window.innerHeight;
    p1Y = Math.max(10, Math.min(540 - paddleH - 10, e.clientY * scale - paddleH / 2));
});

// Key Controls
window.addEventListener('keydown', (e) => {
    if (e.keyCode === 38) upPressed = true;
    if (e.keyCode === 40) downPressed = true;
    if (e.keyCode === 13) { resetBall(); }
    if (e.keyCode === 461 || e.keyCode === 27) {
        if (window.parent && window.parent.closeGame) window.parent.closeGame();
        else history.back();
    }
});
window.addEventListener('keyup', (e) => {
    if (e.keyCode === 38) upPressed = false;
    if (e.keyCode === 40) downPressed = false;
});
</script>
</body>
</html>
