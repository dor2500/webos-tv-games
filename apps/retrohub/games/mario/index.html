<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>סופר מריו קלאסי - Super Mario for LG webOS TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #5c94fc; }
        #wrapper { position: relative; width: 1920px; height: 1080px; }
        canvas { display: block; width: 1920px; height: 1080px; image-rendering: pixelated; }
        #hud {
            position: absolute; top: 20px; left: 60px; right: 60px;
            display: flex; justify-content: space-between; font-size: 32px; font-weight: bold;
            color: #fff; text-shadow: 3px 3px 0px #000; font-family: 'Courier New', monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="wrapper">
    <div id="hud">
        <div>MARIO<br><span id="score">000000</span></div>
        <div>COINS<br>🪙 x<span id="coins">00</span></div>
        <div>WORLD<br>1-1</div>
        <div>TIME<br><span id="time">360</span></div>
    </div>
    <canvas id="marioCanvas" width="960" height="540"></canvas>
</div>

<script>
class MarioAudio {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    jump() {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(250, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
        g.gain.setValueAtTime(0.15, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.15);
    }
    coin() {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(987, this.ctx.currentTime);
        setTimeout(() => o.frequency.setValueAtTime(1318, this.ctx.currentTime), 70);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.3);
    }
}
const sfx = new MarioAudio();

const canvas = document.getElementById('marioCanvas');
const ctx = canvas.getContext('2d');

let mario = { x: 80, y: 380, w: 28, h: 42, vx: 0, vy: 0, grounded: false, facing: 1 };
let cameraX = 0;
let score = 0;
let coins = 0;

// World 1-1 layout blocks
let blocks = [
    { x: 300, y: 320, type: 'Q' },
    { x: 380, y: 320, type: 'B' },
    { x: 420, y: 320, type: 'Q' },
    { x: 460, y: 320, type: 'B' },
    { x: 500, y: 320, type: 'Q' },
    { x: 420, y: 160, type: 'Q' },
    // Pipe
    { x: 650, y: 340, w: 60, h: 80, type: 'PIPE' },
    { x: 850, y: 300, w: 60, h: 120, type: 'PIPE' },
    // Flagpole
    { x: 2200, y: 80, w: 10, h: 340, type: 'FLAG' }
];

let enemies = [
    { x: 520, y: 390, vx: -1, alive: true },
    { x: 920, y: 390, vx: -1, alive: true }
];

let keys = {};

function update() {
    if (keys[37]) { mario.vx = -4; mario.facing = -1; }
    else if (keys[39]) { mario.vx = 4; mario.facing = 1; }
    else mario.vx = 0;

    if (keys[38] && mario.grounded) {
        mario.vy = -12;
        mario.grounded = false;
        sfx.jump();
    }

    mario.vy += 0.55; // Gravity
    mario.x += mario.vx;
    mario.y += mario.vy;

    // Ground collision
    if (mario.y > 380) {
        mario.y = 380;
        mario.vy = 0;
        mario.grounded = true;
    }

    // Camera follow
    if (mario.x - cameraX > 400) cameraX = mario.x - 400;

    // Blocks collision
    blocks.forEach(b => {
        if (b.type === 'Q' || b.type === 'B') {
            const bx = b.x, by = b.y;
            if (mario.x + mario.w > bx && mario.x < bx + 40 && mario.y < by + 40 && mario.y + mario.h > by) {
                if (mario.vy < 0) { // Hit from below
                    mario.y = by + 40;
                    mario.vy = 0;
                    if (b.type === 'Q') {
                        b.type = 'HIT';
                        coins++;
                        score += 200;
                        sfx.coin();
                        document.getElementById('coins').innerText = String(coins).padStart(2, '0');
                        document.getElementById('score').innerText = String(score).padStart(6, '0');
                    }
                } else if (mario.vy > 0 && mario.y < by) {
                    mario.y = by - mario.h;
                    mario.vy = 0;
                    mario.grounded = true;
                }
            }
        }
    });

    // Enemies
    enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.vx;
        if (Math.hypot(mario.x - e.x, mario.y - e.y) < 32) {
            if (mario.vy > 0) {
                e.alive = false;
                mario.vy = -8;
                score += 100;
                document.getElementById('score').innerText = String(score).padStart(6, '0');
            }
        }
    });
}

function render() {
    ctx.clearRect(0, 0, 960, 540);
    ctx.save();
    ctx.translate(-cameraX, 0);

    // Ground
    ctx.fillStyle = '#c84c0c';
    ctx.fillRect(cameraX, 420, 960, 120);
    ctx.fillStyle = '#00a800';
    ctx.fillRect(cameraX, 420, 960, 14);

    // Blocks
    blocks.forEach(b => {
        if (b.type === 'Q') {
            ctx.fillStyle = '#fc9838';
            ctx.fillRect(b.x, b.y, 40, 40);
            ctx.fillStyle = '#000'; ctx.font = 'bold 22px monospace'; ctx.fillText('?', b.x + 12, b.y + 28);
        } else if (b.type === 'B') {
            ctx.fillStyle = '#b84418';
            ctx.fillRect(b.x, b.y, 40, 40);
            ctx.strokeStyle = '#000'; ctx.strokeRect(b.x, b.y, 40, 40);
        } else if (b.type === 'HIT') {
            ctx.fillStyle = '#8c5838';
            ctx.fillRect(b.x, b.y, 40, 40);
        } else if (b.type === 'PIPE') {
            ctx.fillStyle = '#00a800';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#000'; ctx.strokeRect(b.x, b.y, b.w, b.h);
        } else if (b.type === 'FLAG') {
            ctx.fillStyle = '#fff'; ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#00a800'; ctx.beginPath(); ctx.arc(b.x + 5, b.y, 14, 0, Math.PI * 2); ctx.fill();
        }
    });

    // Enemies (Goomba)
    enemies.forEach(e => {
        if (e.alive) {
            ctx.fillStyle = '#a84400';
            ctx.fillRect(e.x, e.y, 30, 30);
            ctx.fillStyle = '#fff'; ctx.fillRect(e.x + 4, e.y + 8, 6, 6); ctx.fillRect(e.x + 18, e.y + 8, 6, 6);
        }
    });

    // Mario
    ctx.save();
    ctx.translate(mario.x, mario.y);
    if (mario.facing === -1) ctx.scale(-1, 1);
    ctx.fillStyle = '#e52521'; ctx.fillRect(4, 0, 20, 10); // Red cap
    ctx.fillStyle = '#f6c89f'; ctx.fillRect(4, 10, 20, 10); // Face
    ctx.fillStyle = '#002688'; ctx.fillRect(2, 20, 24, 14); // Blue Overalls
    ctx.fillStyle = '#e52521'; ctx.fillRect(6, 20, 16, 6); // Red shirt
    ctx.fillStyle = '#653a1a'; ctx.fillRect(2, 34, 10, 8); ctx.fillRect(16, 34, 10, 8); // Shoes
    ctx.restore();

    ctx.restore();
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

window.addEventListener('keydown', (e) => {
    sfx.init();
    keys[e.keyCode] = true;
});
window.addEventListener('keyup', (e) => { keys[e.keyCode] = false; });

loop();
</script>
</body>
</html>
