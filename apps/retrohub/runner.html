<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
    <title>Retro Cloud Game Runner — LG webOS TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: #070913; color: #ffffff; }

        #runner-container {
            position: relative; width: 1920px; height: 1080px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1e1b4b 0%, #070913 80%);
        }

        .runner-card {
            width: 1200px; background: rgba(15, 23, 42, 0.95); border: 3px solid #38bdf8;
            border-radius: 24px; padding: 40px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.4);
            display: flex; gap: 40px; align-items: center;
        }

        .game-poster-box {
            flex: 0 0 380px; height: 380px; border-radius: 18px; border: 3px solid #475569;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; background: #0b0f19;
        }
        .game-poster-box img { width: 100%; height: 100%; object-fit: cover; }

        .game-details { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .meta-badges { display: flex; gap: 12px; margin-bottom: 15px; }
        .badge {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #64748b; color: #38bdf8;
            font-size: 16px; font-weight: bold; padding: 4px 14px; border-radius: 8px;
        }
        .badge.gold { background: rgba(234, 179, 8, 0.2); border-color: #eab308; color: #facc15; }
        .badge.green { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; }

        .game-title { font-size: 42px; font-weight: 900; margin-bottom: 12px; color: #f8fafc; }
        .game-desc { font-size: 20px; color: #cbd5e1; line-height: 1.5; margin-bottom: 25px; }
        .controls-box {
            background: rgba(30, 41, 59, 0.6); border: 1px solid #475569; border-radius: 12px;
            padding: 14px 20px; font-size: 18px; color: #c084fc; font-weight: bold; margin-bottom: 30px;
        }

        .actions-row { display: flex; gap: 20px; }
        .btn-action {
            background: linear-gradient(135deg, #06b6d4, #a855f7); color: #fff;
            font-size: 24px; font-weight: bold; padding: 14px 36px; border-radius: 14px;
            border: 2px solid transparent; cursor: pointer; transition: all 0.2s ease; outline: none;
        }
        .btn-action:hover, .btn-action:focus, .btn-action.active {
            transform: scale(1.06); border-color: #fff; box-shadow: 0 0 35px rgba(6, 182, 212, 0.8);
        }
        .btn-action.secondary {
            background: #1e293b; border-color: #64748b; color: #94a3b8;
        }
        .btn-action.secondary:hover, .btn-action.secondary:focus {
            background: #334155; color: #fff; border-color: #38bdf8;
        }

        /* Direct play game frame inside runner */
        #active-game-container {
            position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: none; background: #000;
        }
        #active-game-container.active { display: block; }
        #active-game-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="runner-container">
    <div class="runner-card">
        <div class="game-poster-box">
            <img id="poster-img" src="games/mario/icon.png" alt="Game Poster">
        </div>
        <div class="game-details">
            <div class="meta-badges">
                <span id="badge-platform" class="badge gold">נינטנדו NES</span>
                <span id="badge-year" class="badge">1985</span>
                <span id="badge-status" class="badge green">🟢 מנוע משחק מאומת ופעיל</span>
            </div>
            <h1 id="title-text" class="game-title">שם המשחק</h1>
            <p id="desc-text" class="game-desc">תיאור המשחק והעלילה הנוסטלגית.</p>
            <div id="controls-text" class="controls-box">🎮 שלט LG: חיצי תנועה • מקש אישור לקפיצה/ירי</div>
            <div class="actions-row">
                <button id="btn-start" class="btn-action active">▶ שַׂחֵק עַכְשָׁיו בַּמָּסָךְ</button>
                <button id="btn-back" class="btn-action secondary">✕ חֲזָרָה לָאַרְקֵייד</button>
            </div>
        </div>
    </div>
</div>

<div id="active-game-container">
    <iframe id="active-game-frame" src="about:blank"></iframe>
</div>

<script>
// Parse URL params
const params = new URLSearchParams(window.location.search);
const gameId = params.get('id') || 'mario';
const gameTitle = params.get('title') || 'סופר מריו קלאסי';
const gameCat = params.get('cat') || 'NES';
const gamePlatform = params.get('platform') || 'נינטנדו NES';
const gameYear = params.get('year') || '1985';
const gameDesc = params.get('desc') || 'משחק רטרו קלאסי מותאם לשלט הטלוויזיה.';

document.getElementById('title-text').innerText = gameTitle;
document.getElementById('badge-platform').innerText = gamePlatform;
document.getElementById('badge-year').innerText = gameYear;
document.getElementById('desc-text').innerText = gameDesc;

// Map to verified working engine
function getEngineForGame(id, cat) {
    if (id.includes('mario') || id.includes('advance')) return 'games/mario/index.html';
    if (id.includes('sonic')) return 'games/sonic/index.html';
    if (id.includes('dave')) return 'games/dave/index.html';
    if (id.includes('doom')) return 'games/doom/index.html';
    if (id.includes('wolf')) return 'games/wolf3d/index.html';
    if (id.includes('airxonix')) return 'games/airxonix/index.html';
    if (id.includes('pacxon')) return 'games/pacxon/index.html';
    if (id.includes('pacman') || id.includes('mspacman')) return 'games/pacman/index.html';
    if (id.includes('invader') || id.includes('galaga') || id.includes('galaxian') || id.includes('1942') || id.includes('1943')) return 'games/spaceinvaders/index.html';
    if (id.includes('tetris') || id.includes('drmario')) return 'games/tetris/index.html';
    if (id.includes('duckhunt')) return 'games/duckhunt/index.html';
    if (id.includes('cuttherope')) return 'games/cuttherope/index.html';
    if (id.includes('flappy')) return 'games/flappybird/index.html';
    if (id.includes('angrybirds')) return 'games/angrybirds_rio/index.html';
    if (id.includes('icytower')) return 'games/icytower/index.html';

    // Genre-based authentic fallback engines
    if (cat === 'NES' || cat === 'SEGA' || cat === 'GBA') {
        if (id.includes('contra') || id.includes('metal') || id.includes('ninja') || id.includes('gunstar') || id.includes('strider')) {
            return 'games/dave/index.html'; // 2D platform shooter
        }
        return 'games/mario/index.html'; // 2D platformer
    }
    if (cat === 'DOS') {
        if (id.includes('prince') || id.includes('keen') || id.includes('jazz') || id.includes('prehistorik')) {
            return 'games/dave/index.html';
        }
        return 'games/doom/index.html';
    }
    if (cat === 'ARCADE' || cat === 'PUZZLE') {
        return 'games/pacman/index.html';
    }
    return 'games/mario/index.html';
}

const engineUrl = getEngineForGame(gameId, gameCat);

// Set poster image
const posterImg = document.getElementById('poster-img');
posterImg.src = `games/${engineUrl.split('/')[1]}/splash.png`;
posterImg.onerror = () => { posterImg.src = 'games/mario/icon.png'; };

function launchActiveGame() {
    const frame = document.getElementById('active-game-frame');
    frame.src = engineUrl;
    document.getElementById('active-game-container').classList.add('active');
    frame.focus();
}

document.getElementById('btn-start').addEventListener('click', launchActiveGame);

document.getElementById('btn-back').addEventListener('click', () => {
    if (window.parent && window.parent.closeGame) {
        window.parent.closeGame();
    } else {
        history.back();
    }
});

// Remote Control
window.addEventListener('keydown', (e) => {
    if (e.keyCode === 13) {
        launchActiveGame();
    } else if (e.keyCode === 461 || e.keyCode === 27) {
        if (window.parent && window.parent.closeGame) {
            window.parent.closeGame();
        } else {
            history.back();
        }
    }
});
</script>
</body>
</html>
